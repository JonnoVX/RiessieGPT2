name: Trigger auto deployment for ca-jschoppink-6365-foundry-agent

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-jschoppink-6365-foundry-agent-AutoDeployTrigger-bef02702-9f4b-4317-a7e8-382267209dd3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAJSCHOPPINK6365FOUNDRYAGENT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAJSCHOPPINK6365FOUNDRYAGENT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAJSCHOPPINK6365FOUNDRYAGENT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.CAJSCHOPPINK6365FOUNDRYAGENT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAJSCHOPPINK6365FOUNDRYAGENT_REGISTRY_PASSWORD }}
          containerAppName: ca-jschoppink-6365-foundry-agent
          resourceGroup: rg-jschoppink-6365-foundry-agent
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


