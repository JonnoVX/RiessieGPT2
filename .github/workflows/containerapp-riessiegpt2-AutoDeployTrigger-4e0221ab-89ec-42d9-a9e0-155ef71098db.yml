name: Trigger auto deployment for containerapp-riessiegpt2

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/containerapp-riessiegpt2-AutoDeployTrigger-4e0221ab-89ec-42d9-a9e0-155ef71098db.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTAINERAPPRIESSIEGPT2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERAPPRIESSIEGPT2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERAPPRIESSIEGPT2_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ./Dockerfile
          registryUrl: riessiegpt2-byg7gqfnfqbjcgb9.azurecr.io.azurecr.io
          registryUsername: ${{ secrets.CONTAINERAPPRIESSIEGPT2_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERAPPRIESSIEGPT2_REGISTRY_PASSWORD }}
          imageToBuild: riessiegpt2-byg7gqfnfqbjcgb9.azurecr.io/riessiegpt2:${{ github.sha }}
          containerAppName: containerapp-riessiegpt2
          resourceGroup: rg-jschoppink-6365
